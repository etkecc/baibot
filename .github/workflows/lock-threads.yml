name: Lock threads

# Locks issues and PRs that have been closed for a long time without activity,
# so that new reports go into new issues.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: lock-threads

jobs:
  lock:
    if: github.repository == 'etkecc/baibot'
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6
        with:
          add-issue-labels: 'outdated'
          process-only: 'issues, prs'
