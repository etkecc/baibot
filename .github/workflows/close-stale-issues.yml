name: Close stale issues and PRs

# Only issues and PRs waiting on their author (labelled needs-info, question or needs-rebase) go stale.
# The `confirmed` label exempts an issue or PR.
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    if: github.repository == 'etkecc/baibot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          exempt-assignees: 'spantaleev,aine-etke'
          operations-per-run: 500

          stale-issue-message: 'This issue is stale because it has been open 60 days with no activity. Remove the stale label or comment, or this will be closed in 7 days. To exempt the issue from being marked as stale again due to inactivity, add the "confirmed" label.'
          close-issue-message: 'This issue was closed because it has been stalled for 7 days with no activity. If it still happens, feel free to reopen it with up-to-date information.'
          stale-issue-label: 'stale'
          exempt-issue-labels: 'confirmed'
          any-of-issue-labels: 'needs-info,question'

          days-before-pr-stale: '365'
          days-before-pr-close: '30'
          stale-pr-message: 'This PR is stale because it has been waiting for information or for its conflicts to be fixed for over a year. Remove the stale label, or this will be closed in 30 days. To exempt the PR from being marked as stale again due to inactivity, add the "confirmed" label.'
          close-pr-message: 'This PR was closed because it has been stalled for 30 days with no activity.'
          stale-pr-label: 'stale'
          exempt-pr-labels: 'confirmed'
          any-of-pr-labels: 'needs-info,needs-rebase'
          # Comments alone (bumps) don't keep a PR alive.
          ignore-pr-updates: true
