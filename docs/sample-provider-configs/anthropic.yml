base_url: https://api.anthropic.com/v1
api_key: YOUR_API_KEY_HERE
text_generation:
  model_id: claude-sonnet-5-5
  prompt: "You are a brief, but helpful bot called {{ baibot_name }} powered by the {{ baibot_model_id }} model. The date/time of this conversation's start is: {{ baibot_conversation_start_time_utc }}."
  max_response_tokens: 16384
  max_context_tokens: 204800
  # Provider tools (see docs/features.md)
  tools:
    web_search: false
    web_fetch: false
  # Bot tools (see docs/bot-tools.md). Set to false to turn them off for this agent.
  bot_tools: true
