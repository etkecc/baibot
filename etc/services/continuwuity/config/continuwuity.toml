[global]
server_name = "continuwuity.127.0.0.1.nip.io"

address = "0.0.0.0"
port = 6167

database_path = "/var/lib/continuwuity"

allow_registration = true
# Open (challengeless) registration only works in builds with the `openreg` feature,
# which release images lack. Registration goes through this static token instead
# (see `register-user.sh`). The very first account still needs the one-time
# token that Continuwuity prints to its logs on first run.
registration_token = "baibot-dev-registration-token"

new_user_displayname_suffix = ""

max_request_size = 20_000_000

allow_federation = false
trusted_servers = ["matrix.org"]

log = "info,state_res=warn,rocket=off,_=off,sled=off"
