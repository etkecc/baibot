[package]
name = "baibot"
description = "A Matrix bot for using diffent capabilities (text-generation, text-to-speech, speech-to-text, image-generation, etc.) of AI / Large Language Models"
authors = ["Slavi Pantaleev <slavi@devture.com>"]
repository = "https://github.com/etkecc/baibot"
license = "AGPL-3.0-or-later"
readme = "README.md"
keywords = ["matrix", "chat", "bot", "AI", "LLM"]
# Releases are CalVer (vYYYY.MM.DD.N), which Cargo cannot represent: their builds embed it via BAIBOT_VERSION.
version = "0.0.0"
# baibot ships as a container image, not as a crate.
publish = false
edition = "2024"

[lib]
name = "baibot"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.*"
async-openai = { version = "0.43.0", features = ["audio", "chat-completion", "image", "responses"] }
base64 = "0.23.*"
chrono = { version = "0.4.*", default-features = false, features = ["std", "now"] }
futures-util = { version = "0.3.*", features = ["sink"] }
# We'd rather not depend on this, but we cannot use the ruma-events EventContent macro without it.
matrix-sdk = { version = "0.19.1", default-features = false }
mime_guess = "2.0.*"
mxidwc = "1.0.*"
mxlink = ">=1.16.1"
ogg = "0.9.*"
opusic-c = "1.6.*"
quick_cache = "0.7.*"
regex = "1.13.*"
# HTTP client for the providers that talk to their APIs directly (anthropic, openai_compat,
# venice). rustls only (no extra TLS stack), matching the
# reqwest copy async-openai/matrix-sdk/mxlink already use.
reqwest = { version = "0.13.*", default-features = false, features = ["json", "multipart", "rustls"] }
serde = { version = "1.0.*", features = ["derive"], default-features = false }
serde_json = "1.0.*"
serde_yaml_ng = "0.10.*"
tiktoken-rs = { version = "0.12.*", default-features = false }
tokio = { version = "1.54.*", features = ["rt", "rt-multi-thread", "macros", "time"] }
tokio-tungstenite = { version = "0.30.*", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tracing = "0.1.*"
tracing-subscriber = { version = "0.3.*", features = ["env-filter"] }
url = "2.5.*"

[profile.release]
strip = true
opt-level = "z"
lto = "thin"
